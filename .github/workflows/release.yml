name: Release Automation

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-release-assets:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows-x64
            os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - name: macOS-arm64
            os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
          - name: macOS-x64
            os: macos-13
            arch: x64
            target: x86_64-apple-darwin
          - name: Linux-x64
            os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            squashfs-tools \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Cargo & Node dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install UI Dependencies
        working-directory: ./ui
        run: npm ci

      - name: Build UI
        working-directory: ./ui
        run: npm run build

      - name: Build Tauri Application Bundle
        run: npx --prefix ui tauri build

      - name: Resolve Application Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VAL="${{ github.event.inputs.tag_name }}"
          else
            TAG_VAL="${{ github.ref_name }}"
          fi
          CLEAN_VER="${TAG_VAL#v}"
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Package & Standardize Windows Asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "release-assets"
          $exe = Get-ChildItem -Path "target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item -Path $exe.FullName -Destination "release-assets/kinana-windows-x64-v$ver-setup.exe"
          } else {
            throw "NSIS installer not found in target/release/bundle/nsis"
          }

      - name: Package & Standardize macOS Asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER="${{ steps.get_version.outputs.version }}"
          ARCH="${{ matrix.platform.arch }}"
          mkdir -p release-assets
          DMG_FILE=$(find target/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -f "$DMG_FILE" ]; then
            cp "$DMG_FILE" "release-assets/kinana-macos-${ARCH}-v${VER}.dmg"
          else
            echo "DMG not found in target/release/bundle/dmg" && exit 1
          fi

      - name: Package & Standardize Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER="${{ steps.get_version.outputs.version }}"
          mkdir -p release-assets
          DEB_FILE=$(find target/release/bundle/deb -name "*.deb" | head -n 1)
          if [ -f "$DEB_FILE" ]; then
            cp "$DEB_FILE" "release-assets/kinana-linux-x64-v${VER}.deb"
          else
            echo "Debian package not found" && exit 1
          fi

          APPIMAGE_FILE=$(find target/release/bundle/appimage -name "*.AppImage" | head -n 1)
          if [ -f "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" "release-assets/kinana-linux-x64-v${VER}.AppImage"
          else
            echo "AppImage not found in target/release/bundle/appimage"
          fi

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform.name }}
          path: release-assets/*
          if-no-files-found: error

  publish-draft-release:
    name: Assemble & Publish Draft Release
    runs-on: ubuntu-latest
    needs: build-release-assets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag & Version
        id: release_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VAL="${{ github.event.inputs.tag_name }}"
          else
            TAG_VAL="${{ github.ref_name }}"
          fi
          echo "tag=${TAG_VAL}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          mkdir -p final-release
          cp downloaded-artifacts/* final-release/
          cd final-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Kinana ${{ steps.release_info.outputs.tag }}"
          draft: true
          prerelease: false
          files: final-release/*
          body: |
            ### Kinana Cross-Platform Release (Draft)
            
            Multi-platform production artifacts for Windows, macOS, and Linux.
            
            #### Checksums (SHA-256)
            Please verify artifact checksums against `SHA256SUMS.txt` before installation.
