[package]
name = "kinana"
version = "0.1.1"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["rustls-tls", "custom-protocol", "tray-icon"] }
kinana-core = { path = "../../pass_app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zeroize = "1.8"
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Credentials", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_ToolHelp"] }


uuid = { version = "1", features = ["v4"] }
rand = "0.8.5"
rfd = "0.15"



[build-dependencies]
tauri-build = { version = "2", features = [] }
