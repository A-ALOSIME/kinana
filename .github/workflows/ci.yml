name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - name: macOS-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
          - name: macOS-x64
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
          - name: Linux-x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            squashfs-tools \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-target }}

      - name: Cache Cargo & Node dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install UI Dependencies & Run Tests
        working-directory: ./ui
        run: |
          npm ci
          npm test

      - name: Run UI Security Audit
        working-directory: ./ui
        run: |
          npm audit --audit-level=high

      - name: Build UI (TypeScript + Vite)
        working-directory: ./ui
        run: |
          npm run build

      - name: Run Cargo Workspace Tests
        run: |
          cargo test --workspace --verbose

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run Cargo Security Audit
        run: |
          cargo audit --file Cargo.lock

      - name: Run Cargo Release Check
        run: |
          cargo check --release --verbose

      - name: Build Tauri Application & Verify Bundling
        run: |
          npx --prefix ui tauri build

      - name: Validate Linux DEB Metadata & Test Installation Smoke
        if: runner.os == 'Linux'
        run: |
          DEB_FILE=$(find target -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ] || [ ! -f "$DEB_FILE" ]; then
            echo "ERROR: No .deb file found in target directory"
            exit 1
          fi
          echo "Inspecting Debian package metadata: $DEB_FILE"
          dpkg-deb --info "$DEB_FILE"
          PKG_NAME=$(dpkg-deb -f "$DEB_FILE" Package)
          echo "Detected Package field: '$PKG_NAME'"
          if [[ ! "$PKG_NAME" =~ ^[a-z0-9][a-z0-9+.-]+$ ]]; then
            echo "ERROR: Invalid Debian package name: '$PKG_NAME'"
            exit 1
          fi
          echo "Running installation smoke test via apt..."
          sudo apt-get update && sudo apt-get install -y "$DEB_FILE"
          echo "Verifying installed binary..."
          which kinana
          ls -la /usr/bin/kinana
          dpkg -l kinana | grep -E "^ii\s+kinana"
          echo "Testing clean package removal..."
          sudo apt-get remove -y kinana

      - name: Upload CI Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-bundle-${{ matrix.platform.name }}
          path: |
            target/release/bundle/*/*
            target/*/release/bundle/*/*
          if-no-files-found: warn
          retention-days: 3
