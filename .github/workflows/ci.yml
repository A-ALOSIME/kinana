name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - name: macOS
            os: macos-latest
            rust-target: aarch64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            squashfs-tools \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-target }}

      - name: Cache Cargo & Node dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install UI Dependencies & Run Tests
        working-directory: ./ui
        run: |
          npm ci
          npm test

      - name: Run UI Security Audit
        working-directory: ./ui
        run: |
          npm audit --audit-level=high

      - name: Build UI (TypeScript + Vite)
        working-directory: ./ui
        run: |
          npm run build

      - name: Run Cargo Workspace Tests
        run: |
          cargo test --workspace --verbose

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run Cargo Security Audit
        run: |
          cargo audit --file Cargo.lock

      - name: Run Cargo Release Check
        run: |
          cargo check --release --verbose

      - name: Build Tauri Application & Verify Bundling
        run: |
          npx --prefix ui tauri build
