name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - name: macOS-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
          - name: macOS-x64
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
          - name: Linux-x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            squashfs-tools \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-target }}

      - name: Cache Cargo & Node dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install UI Dependencies & Run Tests
        working-directory: ./ui
        run: |
          npm ci
          npm test

      - name: Run UI Security Audit
        working-directory: ./ui
        run: |
          npm audit --audit-level=high

      - name: Build UI (TypeScript + Vite)
        working-directory: ./ui
        run: |
          npm run build

      - name: Run Cargo Workspace Tests
        run: |
          cargo test --workspace --verbose

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run Cargo Security Audit
        run: |
          cargo audit --file Cargo.lock

      - name: Run Cargo Release Check
        run: |
          cargo check --release --verbose

      - name: Build Tauri Application & Verify Bundling
        run: |
          npx --prefix ui tauri build --target ${{ matrix.platform.rust-target }}
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Validate macOS Bundle & DMG Integrity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TARGET="${{ matrix.platform.rust-target }}"
          echo "Target architecture: $TARGET"

          echo "Locating built DMG file..."
          DMG_FILE=$(find target -name "*.dmg" | head -n 1)
          if [ -z "$DMG_FILE" ] || [ ! -f "$DMG_FILE" ]; then
            echo "ERROR: DMG file not found in target"
            exit 1
          fi
          echo "Found DMG: $DMG_FILE"

          echo "Verifying DMG integrity with hdiutil verify..."
          hdiutil verify "$DMG_FILE"

          echo "Mounting DMG to verify packaged bundle..."
          MOUNT_DIR=$(mktemp -d /tmp/kinana-ci-XXXXXX)
          cleanup() {
            if mount | grep -q "$MOUNT_DIR"; then
              echo "Detaching temporary DMG mount: $MOUNT_DIR"
              hdiutil detach "$MOUNT_DIR" -force || true
            fi
            rm -rf "$MOUNT_DIR"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse -readonly

          MOUNTED_APP="$MOUNT_DIR/Kinana.app"
          if [ ! -d "$MOUNTED_APP" ]; then
            echo "ERROR: Kinana.app missing inside mounted DMG"
            exit 1
          fi
          echo "Found application bundle inside mounted DMG: $MOUNTED_APP"

          BINARY="$MOUNTED_APP/Contents/MacOS/kinana"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Main executable not found at $BINARY"
            exit 1
          fi

          echo "Checking binary architecture..."
          BIN_INFO=$(file "$BINARY")
          echo "$BIN_INFO"
          if [[ "$TARGET" =~ ^aarch64 ]]; then
            if ! echo "$BIN_INFO" | grep -q "arm64"; then
              echo "ERROR: Expected arm64 architecture, got: $BIN_INFO"
              exit 1
            fi
          elif [[ "$TARGET" =~ ^x86_64 ]]; then
            if ! echo "$BIN_INFO" | grep -qE "(x86_64|x86-64)"; then
              echo "ERROR: Expected x86_64 architecture, got: $BIN_INFO"
              exit 1
            fi
          fi

          echo "Checking Info.plist bundle identifier..."
          PLIST="$MOUNTED_APP/Contents/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found at $PLIST"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" 2>/dev/null || defaults read "$PLIST" CFBundleIdentifier)
          echo "CFBundleIdentifier: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != "com.kinana.vault" ]; then
            echo "ERROR: Unexpected CFBundleIdentifier '$BUNDLE_ID'"
            exit 1
          fi

          echo "Verifying code signature of mounted Kinana.app..."
          codesign --verify --deep --strict --verbose=2 "$MOUNTED_APP"
          codesign -dv --verbose=4 "$MOUNTED_APP"

          echo "Gatekeeper assessment diagnostic (expected unnotarized for ad-hoc build):"
          spctl --assess --type execute --verbose=4 "$MOUNTED_APP" || true

          hdiutil detach "$MOUNT_DIR"
          trap - EXIT
          rm -rf "$MOUNT_DIR"
          echo "macOS CI verification passed."

      - name: Validate Linux DEB Metadata & Test Installation Smoke
        if: runner.os == 'Linux'
        run: |
          DEB_FILE=$(find target -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ] || [ ! -f "$DEB_FILE" ]; then
            echo "ERROR: No .deb file found in target directory"
            exit 1
          fi
          echo "Inspecting Debian package metadata: $DEB_FILE"
          dpkg-deb --info "$DEB_FILE"
          PKG_NAME=$(dpkg-deb -f "$DEB_FILE" Package)
          echo "Detected Package field: '$PKG_NAME'"
          if [[ ! "$PKG_NAME" =~ ^[a-z0-9][a-z0-9+.-]+$ ]]; then
            echo "ERROR: Invalid Debian package name: '$PKG_NAME'"
            exit 1
          fi
          echo "Running installation smoke test via apt..."
          if [[ "$DEB_FILE" != /* && "$DEB_FILE" != ./* ]]; then
            LOCAL_DEB="./$DEB_FILE"
          else
            LOCAL_DEB="$DEB_FILE"
          fi
          sudo apt-get update && sudo apt-get install -y "$LOCAL_DEB"
          echo "Verifying installed binary..."
          which kinana
          ls -la /usr/bin/kinana
          dpkg -l kinana | grep -E "^ii\s+kinana"
          echo "Testing clean package removal..."
          sudo apt-get remove -y kinana

      - name: Upload CI Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-bundle-${{ matrix.platform.name }}
          path: |
            target/release/bundle/*/*
            target/*/release/bundle/*/*
          if-no-files-found: warn
          retention-days: 3
