name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo & Node dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install UI Dependencies & Run Tests
        working-directory: ./ui
        run: |
          npm ci
          npm test

      - name: Run UI Security Audit
        working-directory: ./ui
        run: |
          npm audit --audit-level=critical

      - name: Build UI (TypeScript + Vite)
        working-directory: ./ui
        run: |
          npm run build

      - name: Run Cargo Workspace Tests
        run: |
          cargo test --workspace --verbose

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run Cargo Security Audit
        run: |
          cargo audit --file Cargo.lock

      - name: Run Cargo Release Check
        run: |
          cargo check --release --verbose
